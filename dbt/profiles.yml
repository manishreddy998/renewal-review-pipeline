renewal_review:
  target: local
  outputs:
    # Runs inside Docker with a local Spark session and Delta tables. No account needed.
    local:
      type: spark
      method: session
      host: localhost
      schema: renewal_review
    # Same models on Databricks. Fill DATABRICKS_* in .env, then run with --target databricks.
    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', 'not-set') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', 'not-set') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', 'not-set') }}"
      catalog: workspace
      schema: renewal_review
