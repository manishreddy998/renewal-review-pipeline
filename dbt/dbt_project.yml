name: renewal_review
version: "0.1.0"
profile: renewal_review
config-version: 2

model-paths: ["models"]
target-path: target

models:
  renewal_review:
    +file_format: delta
    staging:
      +materialized: view
    silver:
      +materialized: table
    gold:
      +materialized: table
    eval:
      +materialized: table

seeds:
  renewal_review:
    agency_access:
      +post-hook: "{{ create_agency_row_filter() }}"

vars:
  extraction_endpoint: databricks-gemini-3-5-flash
  prompt_version: v4
  # OCR words read with lower confidence than this are treated as unsure.
  ocr_min_confidence: 60
  # Pricing for the cost estimate (Databricks list price, Oct 2026).
  prompt_chars: 1975
  dbu_per_m_input: 26.786
  dbu_per_m_output: 160.714
  usd_per_dbu: 0.07
